[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-ai"
version = "0.1.0"
description = "Uptime monitoring for AI quality. Proactive testing, drift detection, alerting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "google-generativeai>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=2.0"]

[project.scripts]
vigil = "vigil_ai.cli:main"
vigil-mcp = "vigil_ai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
