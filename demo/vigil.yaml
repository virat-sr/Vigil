# Vigil config for demo — tests against mock server OR real RAG app
name: "Acme Corp RAG"
endpoint: "http://localhost:8500"
response_field: "response"
alert_threshold: 0.15
scorer_model: ""
timeout: 30

tests:
  - name: "return_policy"
    query: "What is the return policy and conditions?"
    expect:
      contains: ["30 days", "full refund", "original packaging"]
      min_length: 50

  - name: "pricing_details"
    query: "What are the pricing plans with exact prices?"
    expect:
      contains: ["$19", "$49", "$199"]
      min_length: 80

  - name: "business_hours"
    query: "What are the business hours including Saturday?"
    expect:
      contains: ["Saturday", "10:00"]
      min_length: 40

  - name: "security_certs"
    query: "What security certifications do you have?"
    expect:
      contains: ["SOC 2"]
      min_length: 40

  - name: "enterprise_features"
    query: "What enterprise features are available like SSO?"
    expect:
      contains: ["SSO", "99.99"]
      min_length: 60

  - name: "support_sla"
    query: "What is the enterprise support response time?"
    expect:
      contains: ["1-hour", "24/7"]
      min_length: 30
